[project]
name = "financas-ml"
version = "0.1.0"
description = "Microsserviço de parsing e categorização do app de finanças"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "python-multipart>=0.0.9",
    "pypdf>=4",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]